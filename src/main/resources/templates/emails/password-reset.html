<div xmlns:th="http://www.thymeleaf.org">

    <h2>🔑 Password Reset</h2>

    <p>Hello <b th:text="${name}"></b>,</p>

    <p>You requested to reset your password.</p>

    <p>
        <a th:href="${resetLink}"
           style="background:#e53e3e;color:white;padding:12px 22px;text-decoration:none;border-radius:5px">
            Reset Password
        </a>
    </p>

    <p>This link expires in 15 minutes.</p>

</div>
