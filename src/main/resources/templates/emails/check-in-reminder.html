<div xmlns:th="http://www.thymeleaf.org">

    <h2>⏰ Check-in Reminder</h2>

    <p>Hello <b th:text="${name}"></b>,</p>

    <p>Your stay is coming soon!</p>

    <ul>
        <li>Hotel: <b th:text="${hotel}"></b></li>
        <li>Check-in Date: <b th:text="${checkIn}"></b></li>
        <li>Booking Ref: <b th:text="${bookingRef}"></b></li>
    </ul>

    <p>We wish you a wonderful stay ✨</p>

</div>
