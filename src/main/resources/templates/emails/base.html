<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body style="font-family: Arial; background:#f4f6f8; padding:20px;">
<table width="600" align="center" style="background:white;padding:30px;border-radius:10px">

    <!-- HEADER -->
    <tr>
        <td style="text-align:center">
            <h1 style="color:#2b6cb0">MareMonte Hotel 🏨</h1>
        </td>
    </tr>

    <!-- CONTENT -->
    <tr>
        <td th:insert="${content}"></td>
    </tr>

    <!-- FOOTER -->
    <tr>
        <td style="text-align:center;padding-top:30px;color:gray;font-size:12px">
            © 2026 MareMonte Hotel — All rights reserved
        </td>
    </tr>

</table>
</body>
</html>
